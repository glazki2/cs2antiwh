// CS2GLAZ server configuration.
// Run "cs2glaz_reload" after editing. The old known-good configuration stays
// active unless every line executes and the final internal marker is reached.

// Show player names for teammates only. Enemy target IDs can otherwise lock
// onto a hidden player's stale client collision at its last transmitted spot.
mp_playerid 1

// Download verified compatible stable updates from this fork's GitHub Releases
// (github.com/glazki2/cs2antiwh). Off by default: native plugin binaries are
// only installed when an administrator opts in. A prepared update installs
// only on the next full server restart.
cs2glaz_auto_update 0

// Master protection switch.
cs2glaz_enable 1

// When the CS2 server binary is newer than the verified gamedata, keep
// protecting with walls only: a conservative hull-shaped body replaces the
// animated capsules, and smoke never hides anyone. 0 turns filtering off
// until matching gamedata is installed. Applies on the next map.
cs2glaz_limited_mode 1

// Let live CS2 smoke block visibility.
cs2glaz_smoke_occlusion 1

// An HE opens this wide a channel through smoke that already existed.
// Set both HE values to 0 to disable HE smoke clearing.
cs2glaz_he_clear_radius_units 180
cs2glaz_he_clear_seconds 3

// Apply the same protection to teammates. FFA is detected automatically.
cs2glaz_filter_teammates 0

// Minimum delay between copied player snapshots.
cs2glaz_update_interval_ms 1

// Background visibility threads (1-4). A changed value starts on the next map.
cs2glaz_worker_threads 2

// Moving/peeking shoulder and movement-origin base. Idle shoulders use half;
// A/D enlarges only the matching shoulder. W/S leaves both shoulders idle
// and only activates the forward/back movement-origin check.
// Larger values reveal enemies behind corners earlier (and to a wallhack);
// the old defaults were 64 / 0.64 / 0.
cs2glaz_shoulder_base_units 48
cs2glaz_shoulder_rtt_scale 0.4
// Zero means the RTT table has no maximum.
cs2glaz_max_shoulder_units 128

// Largest sideways padding of an enemy's bounds corners (units), which reveals
// him just before he steps out from a corner. It grows only towards where he
// moves; a standing enemy gets 4. Larger reveals enemies behind corners
// earlier (and to a wallhack); the old value was 32 on every side.
cs2glaz_bounds_padding_units 16

// Keep a player revealed this long after losing sight, to suppress flicker.
// Lower hides sooner once an enemy goes behind cover; 1000 was the old default.
cs2glaz_visibility_hold_ms 150

// Wait up to this many ms in CheckTransmit for this tick's visibility result
// instead of using the previous tick's (hides and reveals one tick sooner).
// 0 turns the wait off.
cs2glaz_result_wait_ms 3

// Experimental decoys for wallhack users: 0 off, 1 invisible, 2 model drawn
// (only for testing on your own server), 3 invisible and only for watched
// players (CSVILKA detections, cs2glaz_suspect). See README, sections
// "Приманки" and "Связка с CSVILKA".
cs2glaz_decoys 0

// Kick a player once his decoy evidence reaches this: reports at real decoys
// (aims and shots through walls) beyond what an honest player with the same
// decoy time could have, judged by control twins nobody receives (kept by
// SteamID since the plugin loaded). 0 only logs. A report is a suspicion, not
// a proof: start with 3 or more, or leave 0 and read logs/decoys.log.
cs2glaz_decoy_kick 0

// Experimental ghost players (needs cs2glaz_decoys 1, 2 or 3): fake players,
// at most one per enemy team, each sent to one player only and standing in for
// one of his decoys, so a cheat that draws only players (most ESPs) shows it.
// Each takes a player slot; test it on your own server first. 0 = off.
cs2glaz_decoy_ghosts 0

// Experimental phantom players (needs cs2glaz_decoys and -maxplayers below 64):
// player controllers without a client, in entity slots above the player count,
// so they take no player slot; each carries the name of the hidden enemy it
// imitates and is sent to one player only. The least proven feature: test it
// on your own server with your own clients first. 0 = off, up to 32 (with
// cs2glaz_decoy_front 1, at least the number of players).
cs2glaz_decoy_phantoms 0

// Experimental front decoys against aimbots (needs cs2glaz_decoys 1 or 3 and
// cs2glaz_decoy_phantoms): every player gets an invisible phantom a few degrees
// off his crosshair, sent to him only, that jumps away whenever a crosshair
// rests on it. An aimbot locks onto it and follows its jumps; that is logged
// like a decoy report. It takes every phantom. 2 also gives its body a
// player's collision on that player's client, so a triggerbot reading the
// game's crosshair target fires at it (least proven: test with your own
// clients first). 0 = off.
cs2glaz_decoy_front 0

// Experimental crosshair ghosts against triggerbots and aimbots (needs
// cs2glaz_decoys 1 or 3 and two free player slots): two fake players, one per
// team, each shown in turns to one player of the other team for about half a
// second, invisible, sent to him only, standing in the open with its head on
// his crosshair where no other player can see it. A cheat takes it for a real
// enemy; a shot at it right after it reached him is logged as a decoy report
// (crosshair_shot, with the reaction time), weighed against control turns
// where nothing is sent. They use the ghost players instead of
// cs2glaz_decoy_ghosts. Test on your own server first. 0 = off.
cs2glaz_decoy_crosshair 0

// Internal transaction marker. This must remain the final command in this file.
cs2glaz_config_loaded
