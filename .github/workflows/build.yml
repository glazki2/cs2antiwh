name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build, test, verify, and package
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs2glaz-windows-x86_64
          path: |
            packages/cs2glaz-*-windows-x86_64.zip
            packages/SHA256SUMS.txt

  linux:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:2969e5a47146a6494c01d953cd818b1d62712f42f9e54c4809d7a3aa8dc276ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build, test, verify, and package
        run: bash scripts/build-linux.sh --install-tools

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs2glaz-linux-x86_64
          path: |
            packages/cs2glaz-*-linux-x86_64.zip
            packages/SHA256SUMS.txt
